x-app-security: &app-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: sponsorflow
      POSTGRES_USER: sponsorflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponsorflow -d sponsorflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    <<: *app-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      SPONSORFLOW_ENVIRONMENT: production
      SPONSORFLOW_DATABASE_URL: postgresql+psycopg://sponsorflow:${POSTGRES_PASSWORD}@postgres/sponsorflow
      SPONSORFLOW_STORAGE_PATH: /tmp/sponsorflow-data
      SPONSORFLOW_PROVIDER_MODE: live
      SPONSORFLOW_LLM_PROVIDER: ${SPONSORFLOW_LLM_PROVIDER:?set SPONSORFLOW_LLM_PROVIDER}
      SPONSORFLOW_LLM_MODEL: ${SPONSORFLOW_LLM_MODEL:?set SPONSORFLOW_LLM_MODEL}
      SPONSORFLOW_LLM_GATEWAY_URL: ${SPONSORFLOW_LLM_GATEWAY_URL:-}
      SPONSORFLOW_LLM_GATEWAY_PATH: ${SPONSORFLOW_LLM_GATEWAY_PATH:-/v1/chat/completions}
      SPONSORFLOW_LLM_GATEWAY_PROTOCOL: ${SPONSORFLOW_LLM_GATEWAY_PROTOCOL:-openai}
      SPONSORFLOW_LLM_API_KEY: ${SPONSORFLOW_LLM_API_KEY:-}
      SPONSORFLOW_LLM_BEDROCK_REGION: ${SPONSORFLOW_LLM_BEDROCK_REGION:-us-east-1}
      SPONSORFLOW_LLM_VERTEX_PROJECT_ID: ${SPONSORFLOW_LLM_VERTEX_PROJECT_ID:-}
      SPONSORFLOW_LLM_VERTEX_REGION: ${SPONSORFLOW_LLM_VERTEX_REGION:-us-east5}
      SPONSORFLOW_LLM_VERTEX_ENDPOINT: ${SPONSORFLOW_LLM_VERTEX_ENDPOINT:-}
      SPONSORFLOW_LLM_VERTEX_API_VERSION: ${SPONSORFLOW_LLM_VERTEX_API_VERSION:-v1beta1}
      SPONSORFLOW_LLM_VERTEX_AUTH_MODE: metadata
      SPONSORFLOW_LLM_NVIDIA_ENDPOINT: ${SPONSORFLOW_LLM_NVIDIA_ENDPOINT:-https://integrate.api.nvidia.com/v1/chat/completions}
      SPONSORFLOW_LLM_NVIDIA_API_KEY: ${SPONSORFLOW_LLM_NVIDIA_API_KEY:-}
      SPONSORFLOW_LLM_NVIDIA_TOP_P: ${SPONSORFLOW_LLM_NVIDIA_TOP_P:-0.95}
      SPONSORFLOW_LLM_NVIDIA_THINKING: ${SPONSORFLOW_LLM_NVIDIA_THINKING:-true}
      SPONSORFLOW_LLM_NVIDIA_REASONING_EFFORT: ${SPONSORFLOW_LLM_NVIDIA_REASONING_EFFORT:-high}
      SPONSORFLOW_LLM_MAX_OUTPUT_TOKENS: ${SPONSORFLOW_LLM_MAX_OUTPUT_TOKENS:-16384}
      SPONSORFLOW_LLM_TIMEOUT_SECONDS: ${SPONSORFLOW_LLM_TIMEOUT_SECONDS:-120}
      SPONSORFLOW_LLM_MAX_RETRIES: ${SPONSORFLOW_LLM_MAX_RETRIES:-2}
      SPONSORFLOW_ADMIN_API_KEY: ${SPONSORFLOW_ADMIN_API_KEY:?set SPONSORFLOW_ADMIN_API_KEY}
      SPONSORFLOW_OPERATOR_API_KEY: ${SPONSORFLOW_OPERATOR_API_KEY:?set SPONSORFLOW_OPERATOR_API_KEY}
      SPONSORFLOW_VIEWER_API_KEY: ${SPONSORFLOW_VIEWER_API_KEY:?set SPONSORFLOW_VIEWER_API_KEY}
      SPONSORFLOW_INBOUND_WEBHOOK_TOKEN: ${SPONSORFLOW_INBOUND_WEBHOOK_TOKEN:?set SPONSORFLOW_INBOUND_WEBHOOK_TOKEN}
      SPONSORFLOW_PROVIDER_ENCRYPTION_KEY: ${SPONSORFLOW_PROVIDER_ENCRYPTION_KEY:?set SPONSORFLOW_PROVIDER_ENCRYPTION_KEY}
      SPONSORFLOW_CORS_ORIGINS: '[]'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    <<: *app-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - egress

  worker:
    <<: *app-security
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker", "--interval", "5"]
    environment: *backend-environment
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - egress

  crm:
    <<: *app-security
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SPONSORFLOW_ENVIRONMENT: production
      SPONSORFLOW_TRUST_PROXY: "true"
      INTERNAL_API_URL: http://api:8000/api/v1
      INTERNAL_API_ORIGIN: http://api:8000
      SPONSORFLOW_ADMIN_API_KEY: ${SPONSORFLOW_ADMIN_API_KEY:?set SPONSORFLOW_ADMIN_API_KEY}
      SPONSORFLOW_WEB_ADMIN_PASSWORD: ${SPONSORFLOW_WEB_ADMIN_PASSWORD:?set SPONSORFLOW_WEB_ADMIN_PASSWORD}
      SPONSORFLOW_WEB_SESSION_SECRET: ${SPONSORFLOW_WEB_SESSION_SECRET:?set SPONSORFLOW_WEB_SESSION_SECRET}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - edge

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      SPONSORFLOW_DOMAIN: ${SPONSORFLOW_DOMAIN:?set SPONSORFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      crm:
        condition: service_healthy
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  egress:
  edge:
