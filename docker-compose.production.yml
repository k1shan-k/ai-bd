services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sponsorflow
      POSTGRES_USER: sponsorflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponsorflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      SPONSORFLOW_ENVIRONMENT: production
      SPONSORFLOW_DATABASE_URL: postgresql+psycopg://sponsorflow:${POSTGRES_PASSWORD}@postgres/sponsorflow
      SPONSORFLOW_PROVIDER_MODE: live
      SPONSORFLOW_ADMIN_API_KEY: ${SPONSORFLOW_ADMIN_API_KEY:?set SPONSORFLOW_ADMIN_API_KEY}
      SPONSORFLOW_INBOUND_WEBHOOK_TOKEN: ${SPONSORFLOW_INBOUND_WEBHOOK_TOKEN:?set SPONSORFLOW_INBOUND_WEBHOOK_TOKEN}
      SPONSORFLOW_PROVIDER_ENCRYPTION_KEY: ${SPONSORFLOW_PROVIDER_ENCRYPTION_KEY:?set SPONSORFLOW_PROVIDER_ENCRYPTION_KEY}
      SPONSORFLOW_CORS_ORIGINS: '[]'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker", "--interval", "5"]
    environment: *backend-environment
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  crm:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8000/api/v1
      INTERNAL_API_ORIGIN: http://api:8000
      SPONSORFLOW_ADMIN_API_KEY: ${SPONSORFLOW_ADMIN_API_KEY}
      SPONSORFLOW_WEB_ADMIN_PASSWORD: ${SPONSORFLOW_WEB_ADMIN_PASSWORD:?set SPONSORFLOW_WEB_ADMIN_PASSWORD}
      SPONSORFLOW_WEB_SESSION_SECRET: ${SPONSORFLOW_WEB_SESSION_SECRET:?set SPONSORFLOW_WEB_SESSION_SECRET}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SPONSORFLOW_DOMAIN: ${SPONSORFLOW_DOMAIN:?set SPONSORFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      crm:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
