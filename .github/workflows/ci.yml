name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sponsorflow_test
          POSTGRES_USER: sponsorflow
          POSTGRES_PASSWORD: sponsorflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sponsorflow -d sponsorflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPONSORFLOW_ENVIRONMENT: test
      SPONSORFLOW_PROVIDER_MODE: fake
      SPONSORFLOW_DATABASE_URL: postgresql+psycopg://sponsorflow:sponsorflow@localhost:5432/sponsorflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run ruff check backend
      - run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
